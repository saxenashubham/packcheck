<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PackCheck" />
  <title>PackCheck</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <div id="offline" hidden>Offline — changes are saved and will sync</div>

  <!-- Copy config.example.js -> config.js and fill it in first. Loaded as a classic
       script so a missing config shows a friendly message, not a hard module error. -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("service-worker.js").catch(() => {})
      );
    }
    const off = document.getElementById("offline");
    const setNet = () => { off.hidden = navigator.onLine; };
    window.addEventListener("online", setNet);
    window.addEventListener("offline", setNet);
    setNet();
  </script>
</body>
</html>
